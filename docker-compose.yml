services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/ryvo
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      ALLOW_SEED: "true"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
